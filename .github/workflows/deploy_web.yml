name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject stale main before building
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "This run is no longer current main; production publication is blocked." >&2
            exit 1
          fi

      - name: Read pinned toolchain
        id: toolchain
        run: sed -n '/^FLUTTER_VERSION=/p; /^DENO_VERSION=/p' tool/toolchain.env >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.toolchain.outputs.FLUTTER_VERSION }}
          cache: true

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          : "${SUPABASE_URL:?Set the SUPABASE_URL repository secret}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Set the SUPABASE_PUBLISHABLE_KEY repository secret}"
          flutter pub get --enforce-lockfile
          flutter build web --release --no-pub \
            --base-href "/solfege_app/" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web

      - name: Reject stale main immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "Main advanced after this build; stale publication is blocked." >&2
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Probe deployed page availability (HTTP 200)
        timeout-minutes: 3
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..10}; do
            status=$(curl --silent --show-error --location --output /dev/null \
              --write-out '%{http_code}' --connect-timeout 5 --max-time 10 "$PAGE_URL" || true)
            if [[ "$status" == 200 ]]; then
              echo "Published page returned HTTP 200."
              exit 0
            fi
            sleep 3
          done
          echo "Published page did not return HTTP 200 within the bounded availability probe." >&2
          exit 1
