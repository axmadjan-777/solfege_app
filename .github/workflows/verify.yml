name: Verify

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select QA scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          scope=full
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
            scope=$(git diff --no-renames --name-only -z "$BASE_SHA" HEAD | python3 tool/qa_scope.py)
          fi
          echo "mode=$scope" >> "$GITHUB_OUTPUT"
          echo "QA scope: $scope"

      - name: Read pinned toolchain
        if: steps.scope.outputs.mode == 'full'
        id: toolchain
        run: sed -n '/^FLUTTER_VERSION=/p; /^DENO_VERSION=/p; /^NODE_VERSION=/p' tool/toolchain.env >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.mode == 'full'
        with:
          node-version: ${{ steps.toolchain.outputs.NODE_VERSION }}

      - uses: subosito/flutter-action@v2
        if: steps.scope.outputs.mode == 'full'
        with:
          channel: stable
          flutter-version: ${{ steps.toolchain.outputs.FLUTTER_VERSION }}
          cache: true

      - uses: denoland/setup-deno@v2
        if: steps.scope.outputs.mode == 'full'
        with:
          deno-version: ${{ steps.toolchain.outputs.DENO_VERSION }}

      - name: Install audio verification dependency
        if: steps.scope.outputs.mode == 'full'
        run: |
          if [[ -f tool/verify_note_audio.py ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Run independent QA
        env:
          QA_MODE: ${{ steps.scope.outputs.mode }}
        run: |
          if [[ "$QA_MODE" == docs ]]; then
            bash tool/verify.sh --docs-only
          else
            bash tool/verify.sh
          fi
