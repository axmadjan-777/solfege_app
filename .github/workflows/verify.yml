name: Build baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read pinned Flutter version
        id: toolchain
        run: sed -n '/^FLUTTER_VERSION=/p' tool/toolchain.env >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.toolchain.outputs.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter build web --release --no-pub
