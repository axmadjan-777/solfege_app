name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read pinned toolchain
        id: toolchain
        run: sed -n '/^FLUTTER_VERSION=/p; /^DENO_VERSION=/p' tool/toolchain.env >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.toolchain.outputs.FLUTTER_VERSION }}
          cache: true

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.toolchain.outputs.DENO_VERSION }}

      - name: Run independent QA
        run: bash tool/verify.sh
